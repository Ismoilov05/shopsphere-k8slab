apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  namespace: shopsphere-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
    spec:
      containers:
        - name: product-api
          image: shopsphere-product-api:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-api
  namespace: shopsphere-dev
spec:
  type: ClusterIP
  selector:
    app: product-api
  ports:
    - name: http
      port: 80
      targetPort: http
